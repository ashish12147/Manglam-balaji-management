  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  eslint: 10.8.0
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.2.1
