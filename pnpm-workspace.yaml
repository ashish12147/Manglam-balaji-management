packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
autoInstallPeers: false
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.18
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=3.0.0 <4.0.0': 3.0.6
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@>=3.0.0 <3.3.17': 3.3.17

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': 26.6.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 10.11.0
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vitest: 5.0.3
  zod: 4.2.1
